{% extends "base.html" %}

{% block title %}
Interview Mirror - Sign Up
{% endblock %}


{% block content %}

<style>

/* =====================================================
   SIGN UP PAGE
===================================================== */

.signup-page {

    min-height: calc(100vh - 160px);

    padding-bottom: 50px;

}


/* =====================================================
   TITLE
===================================================== */

.title {

    text-align: center;

    padding: 45px 20px 25px;

    background:
    radial-gradient(
        circle at center,
        #063b80,
        #020b24 65%
    );

}


.title h1 {

    font-size: 42px;

    margin-bottom: 12px;

    color: white;

}


.title h1 span {

    color: #0797ff;

}


.title p {

    color: #b9d4f5;

    font-size: 17px;

    line-height: 1.6;

}


/* =====================================================
   SIGNUP BOX
===================================================== */

.signup {

    width: 450px;

    max-width: 90%;

    margin: 25px auto 60px;

    background:
    linear-gradient(
        145deg,
        #071b42,
        #04102a
    );

    padding: 32px;

    border: 1px solid #1459a5;

    border-radius: 14px;

    box-shadow:
    0 5px 25px rgba(0,0,0,0.4);

    transition: 0.3s;

}


.signup:hover {

    border-color: #079cff;

    box-shadow:
    0 0 28px rgba(0,140,255,0.35);

}


/* =====================================================
   FORM HEADING
===================================================== */

.signup h2 {

    text-align: center;

    color: #4db7ff;

    margin-bottom: 25px;

    font-size: 28px;

}


/* =====================================================
   LABEL
===================================================== */

.signup label {

    display: block;

    font-weight: bold;

    color: #dcecff;

    margin-bottom: 6px;

}


/* =====================================================
   INPUTS
===================================================== */

.signup input[type="text"],
.signup input[type="email"],
.signup input[type="tel"],
.signup input[type="password"],
.signup input[type="file"],
.signup textarea {

    width: 100%;

    padding: 12px;

    margin-top: 5px;

    margin-bottom: 18px;

    border: 1px solid #245c99;

    border-radius: 6px;

    background: #020c22;

    color: white;

    font-size: 15px;

    outline: none;

    transition: 0.3s;

}


/* =====================================================
   FILE INPUT
===================================================== */

.signup input[type="file"] {

    cursor: pointer;

    color: #c7d9ed;

    padding: 10px;

}


.signup input[type="file"]::file-selector-button {

    background:
    linear-gradient(
        90deg,
        #006eff,
        #00aaff
    );

    color: white;

    border: none;

    padding: 8px 14px;

    border-radius: 5px;

    cursor: pointer;

    margin-right: 10px;

    font-weight: bold;

}


/* =====================================================
   PLACEHOLDER
===================================================== */

.signup input::placeholder,
.signup textarea::placeholder {

    color: #7693b8;

}


/* =====================================================
   INPUT FOCUS
===================================================== */

.signup input[type="text"]:focus,
.signup input[type="email"]:focus,
.signup input[type="tel"]:focus,
.signup input[type="password"]:focus,
.signup input[type="file"]:focus,
.signup textarea:focus {

    border-color: #079cff;

    box-shadow:
    0 0 10px rgba(0,140,255,0.3);

}


/* =====================================================
   GENDER
===================================================== */

.gender {

    margin-top: 5px;

    margin-bottom: 18px;

    color: #c1d3eb;

}


.gender input {

    margin-right: 6px;

    accent-color: #079cff;

}


.gender input:nth-of-type(2) {

    margin-left: 20px;

}


/* =====================================================
   TEXTAREA
===================================================== */

.signup textarea {

    resize: vertical;

    min-height: 100px;

    font-family: Arial, sans-serif;

}


/* =====================================================
   REGISTER BUTTON
===================================================== */

.btn {

    width: 100%;

    background:
    linear-gradient(
        90deg,
        #006eff,
        #00aaff
    );

    color: white;

    padding: 13px;

    border: none;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
    0 0 18px rgba(0,140,255,0.35);

    transition: 0.3s;

}


.btn:hover {

    transform: translateY(-3px);

    box-shadow:
    0 0 15px #00aaff,
    0 0 30px #006eff;

}


/* =====================================================
   LOGIN
===================================================== */

.login {

    text-align: center;

    margin-top: 22px;

}


.login p {

    color: #b9cde8;

    font-size: 15px;

}


.login a {

    text-decoration: none;

    color: #36aaff;

    font-weight: bold;

    margin-left: 5px;

}


.login a:hover {

    color: #7acbff;

    text-decoration: underline;

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeUp {

    from {

        opacity: 0;

        transform: translateY(25px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


.title,
.signup {

    animation: fadeUp 0.8s ease;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 600px) {

    .title {

        padding: 40px 15px 20px;

    }


    .title h1 {

        font-size: 34px;

    }


    .title p {

        font-size: 15px;

    }


    .signup {

        width: 90%;

        padding: 25px;

        margin-bottom: 40px;

    }

}

</style>


<div class="signup-page">


    <!-- =================================================
         TITLE
    ================================================= -->

    <div class="title">

        <h1>

            Sign <span>Up</span>

        </h1>


        <p>

            Create your account to begin your interview preparation.

        </p>

    </div>


    <!-- =================================================
         SIGNUP FORM
    ================================================= -->

    <div class="signup">


        <h2>

            Create Account

        </h2>


        <form
            id="registerForm"
            action="/register"
            method="POST"
            enctype="multipart/form-data"
        >


            <!-- ================= FULL NAME ================= -->

            <label for="name">

                Full Name

            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter Full Name"
                minlength="3"
                maxlength="50"
                autocomplete="name"
                required
            >


            <!-- ================= EMAIL ================= -->

            <label for="email">

                Email Address

            </label>


            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email Address"
                maxlength="100"
                autocomplete="email"
                required
            >


            <!-- ================= MOBILE ================= -->

            <label for="mobile">

                Mobile Number

            </label>


            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter Mobile Number"
                maxlength="10"
                minlength="10"
                pattern="[6-9][0-9]{9}"
                inputmode="numeric"
                required
            >


            <!-- ================= GENDER ================= -->

            <label>

                Gender

            </label>


            <div class="gender">

                <input
                    type="radio"
                    name="gender"
                    value="Male"
                    required
                >

                Male


                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female

            </div>


            <!-- ================= PASSWORD ================= -->

            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create Password"
                minlength="8"
                maxlength="20"
                autocomplete="new-password"
                required
            >


            <!-- ================= CONFIRM PASSWORD ================= -->

            <label for="confirmPassword">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm Password"
                minlength="8"
                maxlength="20"
                autocomplete="new-password"
                required
            >


            <!-- ================= ADDRESS ================= -->

            <label for="address">

                Address

            </label>


            <textarea
                id="address"
                name="address"
                rows="4"
                minlength="10"
                maxlength="200"
                placeholder="Enter Address"
                required
            ></textarea>


            <!-- ================= RESUME ================= -->

            <label for="resume">

                Upload Resume

            </label>


            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,application/pdf"
                required
            >


            <!-- ================= REGISTER BUTTON ================= -->

            <button
                type="submit"
                class="btn"
            >

                Register Now

            </button>


        </form>


        <!-- =================================================
             LOGIN
        ================================================= -->

        <div class="login">

            <p>

                Already have an account?

                <a href="/signin">

                    Sign In

                </a>

            </p>

        </div>


    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

$(document).ready(function(){


    /* =====================================================
       FORM SUBMIT
    ===================================================== */

    $("#registerForm").submit(function(event){

        event.preventDefault();


        /* ================= GET VALUES ================= */

        let name_txt =
            $("#name").val().trim();

        let email_txt =
            $("#email").val().trim();

        let mobile_no_txt =
            $("#mobile").val().trim();

        let password_txt =
            $("#password").val();

        let conf_password_txt =
            $("#confirmPassword").val();

        let address_txt =
            $("#address").val().trim();

        let gender =
            $("input[name='gender']:checked").val();


        /* ================= NAME ================= */

        if(name_txt == "")
        {

            alert("Please enter your name");

            $("#name").focus();

            return false;

        }


        if(name_txt.length < 3)
        {

            alert(
                "Name must contain at least 3 characters"
            );

            $("#name").focus();

            return false;

        }


        if(!/^[A-Za-z ]+$/.test(name_txt))
        {

            alert(
                "Name should contain only letters and spaces"
            );

            $("#name").focus();

            return false;

        }


        /* ================= EMAIL ================= */

        if(email_txt == "")
        {

            alert(
                "Please enter your email address"
            );

            $("#email").focus();

            return false;

        }


        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email_txt))
        {

            alert(
                "Please enter a valid email address"
            );

            $("#email").focus();

            return false;

        }


        /* ================= MOBILE ================= */

        if(mobile_no_txt == "")
        {

            alert(
                "Please enter mobile number"
            );

            $("#mobile").focus();

            return false;

        }


        if(!/^[6-9][0-9]{9}$/.test(mobile_no_txt))
        {

            alert(
                "Please enter a valid 10 digit mobile number"
            );

            $("#mobile").focus();

            return false;

        }


        /* ================= GENDER ================= */

        if(!gender)
        {

            alert(
                "Please select your gender"
            );

            return false;

        }


        /* ================= PASSWORD ================= */

        if(password_txt == "")
        {

            alert(
                "Please enter password"
            );

            $("#password").focus();

            return false;

        }


        if(password_txt.length < 8)
        {

            alert(
                "Password must contain at least 8 characters"
            );

            $("#password").focus();

            return false;

        }


        if(!/[A-Z]/.test(password_txt))
        {

            alert(
                "Password must contain at least one uppercase letter"
            );

            $("#password").focus();

            return false;

        }


        if(!/[a-z]/.test(password_txt))
        {

            alert(
                "Password must contain at least one lowercase letter"
            );

            $("#password").focus();

            return false;

        }


        if(!/[0-9]/.test(password_txt))
        {

            alert(
                "Password must contain at least one number"
            );

            $("#password").focus();

            return false;

        }


        /* ================= CONFIRM PASSWORD ================= */

        if(conf_password_txt == "")
        {

            alert(
                "Please confirm your password"
            );

            $("#confirmPassword").focus();

            return false;

        }


        if(password_txt != conf_password_txt)
        {

            alert(
                "Password and Confirm Password do not match"
            );

            $("#confirmPassword").focus();

            return false;

        }


        /* ================= ADDRESS ================= */

        if(address_txt == "")
        {

            alert(
                "Please enter your address"
            );

            $("#address").focus();

            return false;

        }


        if(address_txt.length < 10)
        {

            alert(
                "Address must contain at least 10 characters"
            );

            $("#address").focus();

            return false;

        }


        /* ================= RESUME ================= */

        let resume_file =
            $("#resume")[0].files[0];


        if(!resume_file)
        {

            alert(
                "Please upload your resume"
            );

            $("#resume").focus();

            return false;

        }


        /* ================= RESUME TYPE ================= */

        let file_name =
            resume_file.name.toLowerCase();


        if(!file_name.endsWith(".pdf"))
        {

            alert(
                "Only PDF resume is allowed"
            );

            $("#resume").val("");

            $("#resume").focus();

            return false;

        }


        /* ================= RESUME SIZE ================= */

        if(resume_file.size > 5 * 1024 * 1024)
        {

            alert(
                "Resume size must be less than 5 MB"
            );

            $("#resume").val("");

            $("#resume").focus();

            return false;

        }


        /* =================================================
           SUBMIT TO FLASK
        ================================================= */

        $("#registerForm")[0].submit();

    });


    /* =====================================================
       NAME RESTRICTION
    ===================================================== */

    $("#name").on("input", function(){

        this.value =
            this.value.replace(
                /[^A-Za-z ]/g,
                ""
            );

    });


    /* =====================================================
       MOBILE RESTRICTION
    ===================================================== */

    $("#mobile").on("input", function(){

        this.value =
            this.value.replace(
                /[^0-9]/g,
                ""
            );


        if(this.value.length > 10)
        {

            this.value =
                this.value.substring(0,10);

        }

    });


    /* =====================================================
       PASSWORD LIMIT
    ===================================================== */

    $("#password, #confirmPassword").on(
        "input",
        function(){

            if(this.value.length > 20)
            {

                this.value =
                    this.value.substring(0,20);

            }

        }
    );


    /* =====================================================
       ADDRESS LIMIT
    ===================================================== */

    $("#address").on(
        "input",
        function(){

            if(this.value.length > 200)
            {

                this.value =
                    this.value.substring(0,200);

            }

        }
    );


    /* =====================================================
       RESUME VALIDATION
    ===================================================== */

    $("#resume").on("change", function(){

        let file = this.files[0];


        if(!file)
        {

            return;

        }


        let file_name =
            file.name.toLowerCase();


        if(!file_name.endsWith(".pdf"))
        {

            alert(
                "Only PDF resume is allowed"
            );

            this.value = "";

            return;

        }


        if(file.size > 5 * 1024 * 1024)
        {

            alert(
                "Resume size must be less than 5 MB"
            );

            this.value = "";

            return;

        }

    });


});

</script>

{% endblock %}
